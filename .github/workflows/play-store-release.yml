name: Play Store Release Build

on:
  push:
    branches:
      - release/play-store-release

jobs:
  build:
    name: Build Android Release AAB
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Decode Keystore
        working-directory: ./mobile/android/app
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
          else
            echo "RELEASE_KEYSTORE_BASE64 is not set. Skipping keystore decode."
          fi

      - name: Build Android Release AAB
        working-directory: ./mobile/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
